<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [autoFocus]="isMobile() ? 'first-tabbable' : false"
  >
    <garden-sidebar
      [isMobile]="isMobile()"
      (plantSelected)="onPlantSelected()"
      (closeDrawer)="sidenav.close()"
    ></garden-sidebar>
  </mat-sidenav>
  <mat-sidenav-content class="app-sidenav-content">
    <garden-dashboard
      [isMobile]="isMobile()"
      (toggleSidebar)="sidenav.toggle()"
    ></garden-dashboard>
  </mat-sidenav-content>
</mat-sidenav-container>
