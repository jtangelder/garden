<nav class="sidebar-nav" aria-label="Plantenlijst">
  <mat-toolbar class="sidebar-toolbar">
    <mat-icon aria-hidden="true">yard</mat-icon>
    <span class="sidebar-brand">Mijn Planten</span>
    <span class="toolbar-spacer"></span>
    @if (isMobile()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Zijbalk sluiten"
        (click)="closeDrawer.emit()"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    }
  </mat-toolbar>

  <div class="sidebar-list-wrapper">
    <mat-nav-list aria-label="Planten in spreadsheet">
      @for (plant of service.plants(); track plant.rowNumber) {
        <a
          mat-list-item
          [activated]="service.selectedPlant()?.rowNumber === plant.rowNumber"
          [attr.aria-current]="service.selectedPlant()?.rowNumber === plant.rowNumber ? 'true' : null"
          (click)="selectPlant(plant.rowNumber)"
        >
          <span matListItemTitle>{{ plant.name }}</span>
          <span matListItemLine>
            {{ plant.location || plant.species || 'Rij ' + plant.rowNumber }}
          </span>
        </a>
      }
    </mat-nav-list>
  </div>

  <div class="sidebar-actions">
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="openAddPlantDialog()"
      matTooltip="Maak een foto van een plant zodat AI deze herkent en toevoegt aan je spreadsheet"
    >
      <mat-icon aria-hidden="true">add_a_photo</mat-icon>
      <span>Foto van plant</span>
    </button>
    <button
      matButton="tonal"
      type="button"
      (click)="openSettingsDialog()"
      matTooltip="Kies Google Sheet, Agenda en OAuth-instellingen"
    >
      <mat-icon aria-hidden="true">settings</mat-icon>
      <span>Bronnen &amp; Opties</span>
    </button>
  </div>
</nav>
